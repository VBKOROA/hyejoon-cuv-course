spring:
  datasource:
    url: jdbc:mysql://localhost:3308/hjcuv-dev
    username: hjcuv
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        show_sql: false
    # 테스트용으로 테스트 시작/종료 시 스키마를 만들고 제거합니다.
    ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 20250925_1530
    validate-on-migrate: true
    # 테스트 환경에서는 clean 후 마이그레이션을 허용할 수 있도록 false로 설정
    clean-disabled: false
  cache:
    type: redis

lock:
  redis:
    registry-key: "course-service:regist-course:test"
    expired-ms: 1000
